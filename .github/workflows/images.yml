# Builds the Deploy King images and publishes them to GitHub's container registry:
#   ghcr.io/iamprashanta/deploy-king-api, -worker, -panel
# for linux/amd64 and linux/arm64.
#
# Tags:
#   a push to v3.x        -> v3.x, latest, sha-<commit>
#   a version tag v3.1.0  -> 3.1.0, 3.1, sha-<commit>
# The server installer pulls them with: install.sh --images ghcr [--version v3.1.0]
#
# The first publish creates the packages as private. Make each one public once
# (GitHub: Packages -> package settings -> Change visibility), or servers cannot pull them.
name: images

on:
  push:
    branches: [v3.x]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, panel]
    steps:
      - uses: actions/checkout@v4

      # arm64 is built under emulation
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/iamprashanta/deploy-king-${{ matrix.app }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/v3.x' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=deploy-king-${{ matrix.app }}
            org.opencontainers.image.description=Deploy King ${{ matrix.app }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          provenance: false
