# Deploy King: the whole platform on one machine.
#
#   cp deploy/.env.example deploy/.env      # then fill in the secrets, or: bash deploy/gen-env.sh
#   docker compose -f deploy/compose.yml up -d --build --wait
#
# The API applies database migrations when it starts, and creates the first admin from
# INITIAL_ADMIN_PASSWORD when there is no user yet. scripts/install.sh writes the .env for you.
# Add deploy/compose.tls.yml (COMPOSE_FILE in .env) for HTTPS with Let's Encrypt.

name: ${COMPOSE_PROJECT_NAME:-deploy-king}

x-dk-env: &dk-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-dbbkp}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@dbbkp-postgres:5432/${POSTGRES_DB:-dbbkp_panel}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@dbbkp-redis:6379
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  INTERNAL_SECRET: ${INTERNAL_SECRET:?Set INTERNAL_SECRET in .env}
  MASTER_KEY: ${MASTER_KEY:?Set MASTER_KEY in .env (64 hex characters)}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  API_PORT: "4000"
  API_INTERNAL_URL: http://dbbkp-api:4000
  SITES_ROOT: /var/www/sites
  DBBKP_NETWORK: ${DBBKP_NETWORK:-dbbkp}
  DBBKP_BASE_DOMAIN: ${DBBKP_BASE_DOMAIN:-localhost}
  DBBKP_TLS: ${DBBKP_TLS:-false}
  DBBKP_PUBLIC_HTTP_PORT: ${DBBKP_PUBLIC_HTTP_PORT:-${TRAEFIK_HTTP_PORT:-80}}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-}
  DK_BACKUP_DIR: /var/backups/dbbkp
  DBBKP_VERSION: ${DK_VERSION:-}

# Settings not listed above (GitHub, Cloudflare, mail, limits) are read from .env as they are.
x-dk-env-file: &dk-env-file
  - path: .env
    required: false
  # The desktop app's settings (DESKTOP_MODE, DESKTOP_KEY_FILE, ...); see compose.desktop.yml.
  - path: /etc/deploy-king/desktop.env
    required: false

services:
  dbbkp-postgres:
    image: ${DK_POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ${DK_NAME:-dbbkp}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbbkp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dbbkp_panel}
    volumes:
      - dk-postgres:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  dbbkp-redis:
    image: ${DK_REDIS_IMAGE:-redis:7-alpine}
    container_name: ${DK_NAME:-dbbkp}-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes"]
    volumes:
      - dk-redis:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Sends <app>.<domain> to each app's container, and the panel's address to the panel.
  dbbkp-traefik:
    image: ${DK_TRAEFIK_IMAGE:-traefik:v3.6}
    container_name: ${DK_NAME:-dbbkp}-traefik
    restart: unless-stopped
    environment:
      TRAEFIK_PROVIDERS_DOCKER: "true"
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: ${DBBKP_NETWORK:-dbbkp}
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"
      TRAEFIK_API_DASHBOARD: "false"
      TRAEFIK_PING: "true"
      TRAEFIK_LOG_LEVEL: ${TRAEFIK_LOG_LEVEL:-WARN}
    ports:
      - "${TRAEFIK_BIND:-0.0.0.0}:${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_BIND:-0.0.0.0}:${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dk-letsencrypt:/letsencrypt
    networks: [apps]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dbbkp-api:
    image: ${DK_IMAGE_PREFIX:-deploy-king}-api:${DK_TAG:-local}
    build:
      context: ${DK_SOURCE:-..}
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: ${DK_NODE_IMAGE:-node:22-alpine}
    container_name: ${DK_NAME:-dbbkp}-api
    restart: unless-stopped
    env_file: *dk-env-file
    environment:
      <<: *dk-env
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      DK_SSH_RECORDINGS_DIR: /var/lib/deploy-king/ssh-recordings
    ports:
      # Local tools only; browsers and the CLI go through the panel, which forwards /api, /trpc, /mcp and /ws.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-4000}:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DK_SITES_DIR:-dk-sites}:/var/www/sites
      # Server watch: the host scan's report, and Remove/Undo requests to the host helper.
      - ${DK_SCAN_DIR:-dk-scan}:/host-scan:ro
      - ${DK_ACTION_REQUESTS_DIR:-dk-action-requests}:/host-actions/requests
      - ${DK_ACTION_RESULTS_DIR:-dk-action-results}:/host-actions/results:ro
      # Recordings of terminal sessions to servers (SSH)
      - ${DK_SSH_RECORDINGS_VOLUME:-dk-ssh-recordings}:/var/lib/deploy-king/ssh-recordings
      - ${DK_BACKUP_VOLUME:-dk-backups}:/var/backups/dbbkp
    depends_on:
      dbbkp-postgres:
        condition: service_healthy
      dbbkp-redis:
        condition: service_healthy
    networks: [internal, apps]

  dbbkp-worker:
    image: ${DK_IMAGE_PREFIX:-deploy-king}-worker:${DK_TAG:-local}
    build:
      context: ${DK_SOURCE:-..}
      dockerfile: apps/worker/Dockerfile
      args:
        NODE_IMAGE: ${DK_NODE_IMAGE:-node:22-alpine}
    container_name: ${DK_NAME:-dbbkp}-worker
    restart: unless-stopped
    env_file: *dk-env-file
    environment:
      <<: *dk-env
      # Backups read and restore the apps' volumes here (Docker's own folder for named volumes).
      DK_VOLUME_ROOT: /var/lib/docker/volumes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DK_SITES_DIR:-dk-sites}:/var/www/sites
      - ${DK_BACKUP_VOLUME:-dk-backups}:/var/backups/dbbkp
      - ${DK_DOCKER_VOLUMES_DIR:-/var/lib/docker/volumes}:/var/lib/docker/volumes
    depends_on:
      # The API applies the migrations first.
      dbbkp-api:
        condition: service_healthy
    # On the apps network: a new release is checked on its own address before it goes live.
    networks: [internal, apps]

  dbbkp-panel:
    image: ${DK_IMAGE_PREFIX:-deploy-king}-panel:${DK_TAG:-local}
    build:
      context: ${DK_SOURCE:-..}
      dockerfile: apps/panel/Dockerfile
      args:
        NODE_IMAGE: ${DK_NODE_IMAGE:-node:22-alpine}
        # Only when WebSockets must go to another address than the panel's own (rare).
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    container_name: ${DK_NAME:-dbbkp}-panel
    restart: unless-stopped
    environment:
      DK_API_URL: http://dbbkp-api:4000
      API_INTERNAL_URL: http://dbbkp-api:4000
    ports:
      - "${PANEL_BIND:-0.0.0.0}:${PANEL_PORT:-3000}:3000"
    depends_on:
      dbbkp-api:
        condition: service_started
    networks: [internal, apps]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${DBBKP_NETWORK:-dbbkp}
      traefik.http.routers.dk-panel.rule: Host(`${PANEL_DOMAIN:-portal.localhost}`)
      traefik.http.routers.dk-panel.entrypoints: web
      traefik.http.routers.dk-panel.service: dk-panel
      traefik.http.services.dk-panel.loadbalancer.server.port: "3000"

networks:
  # Database and queue: reachable by the platform only, never by apps.
  internal: {}
  # Traefik and every deployed app. The fixed name is what the worker attaches apps to.
  apps:
    name: ${DBBKP_NETWORK:-dbbkp}

volumes:
  dk-postgres:
  dk-redis:
  dk-letsencrypt:
  dk-sites:
  dk-scan:
  dk-action-requests:
  dk-action-results:
  dk-ssh-recordings:
  dk-backups:
